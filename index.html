<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>excamação smiliorp !smilerp</title>
<style>
  body {
    background: #7fd1ff;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    color: #222;
  }
  .topo {
    background: #ff6600;
    color: white;
    padding: 15px;
    text-align: center;
    border: 3px solid #000;
  }
  .topo h1 {
    margin: 0;
    font-size: 26px;
  }
  .topo p {
    margin: 6px 0 0 0;
    font-size: 13px;
  }
  .info {
    margin: 10px 0;
    font-size: 12px;
    color: #444;
  }
  .info button {
    padding: 4px 10px;
    background: #33cc33;
    color: white;
    border: none;
    font-weight: bold;
    cursor: pointer;
  }
  .server {
    background: white;
    border: 2px solid #555;
    margin: 12px 8px 12px 0;
    padding: 10px 14px;
    width: 420px;
  }
  .server.off {
    background: #ffcccc;
  }
  .server.on {
    background: #ccffcc;
  }
  .server h3 {
    margin: 0 0 6px 0;
    font-size: 17px;
  }
  .server .ip {
    font-family: "Courier New", monospace;
    font-size: 12px;
    color: #555;
  }
  .server p {
    margin: 4px 0;
    font-size: 14px;
  }
  .server .status {
    font-weight: bold;
  }
  .server .botoes {
    margin-top: 8px;
  }
  .server .botoes button {
    font-size: 12px;
    padding: 4px 8px;
    margin-right: 4px;
    background: #eee;
    border: 1px solid #888;
    cursor: pointer;
  }
  table {
    font-size: 12px;
    border-collapse: collapse;
    margin-top: 6px;
  }
  td, th {
    border: 1px solid #999;
    padding: 2px 6px;
  }
  .rodape {
    margin-top: 30px;
    font-size: 11px;
    color: #333;
  }
</style>
</head>
<body>

<div class="topo">
  <h1>exclamação smiliorp !smilerp</h1>
  <p>0 playerkkkkkkkkkk</p>
</div>

<div class="info">
  ultima consulta: <span id="stamp">ainda nao</span>
  &nbsp;|&nbsp;
  <button id="refresh" type="button">atualizar</button>
</div>

<div id="list"></div>

<div class="rodape">
  mensagem importante: sexo
</div>

<script>
// Único servidor consultado. Não há campo para trocar.
const ADDR = "131.196.196.198:27015";

let result = null;
let showPlayers = false;

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtTime = s => `${Math.floor(s/60)}min ${s%60}s`;

function render() {
  const list = document.getElementById("list");
  const r = result;
  if (!r) {
    list.innerHTML = `<div class="server"><h3>${esc(ADDR)}</h3><p>carregando...</p></div>`;
    return;
  }
  const on = r.online;
  let body = "";
  if (on) {
    body = `
      <p>jogadores: <b>${r.players}/${r.max_players}</b></p>
      <p>mapa: ${esc(r.map)}</p>
      <p>gamemode: ${esc(r.game)}</p>
      <p>ping: ${r.ping}ms | bots: ${r.bots} | humanos: ${Math.max(r.players - r.bots, 0)}</p>
      <p>senha: ${r.password ? "sim" : "nao"} | vac: ${r.vac ? "sim" : "nao"}</p>
      <p>sistema: ${esc(r.os)} | versao: ${esc(r.version)}</p>`;
    if (showPlayers) {
      const rows = (r.player_list || []).map(p =>
        `<tr><td>${esc(p.name)}</td><td>${p.score}</td><td>${fmtTime(p.time)}</td></tr>`).join("");
      body += rows
        ? `<table><tr><th>nome</th><th>pts</th><th>tempo</th></tr>${rows}</table>`
        : `<p>sem ninguem listado</p>`;
    }
  } else {
    body = `<p>${esc(r.error || "offline")}</p>`;
  }
  list.innerHTML = `<div class="server ${on ? "on" : "off"}">
    <h3>${on ? esc(r.name) : esc(ADDR)}</h3>
    <div class="ip">${esc(ADDR)}</div>
    <p class="status">${on ? "ONLINE" : "OFFLINE"}</p>
    ${body}
    <div class="botoes">
      ${on ? `<button data-act="players">${showPlayers ? "fechar" : "ver"} players</button>
      <button data-act="copy">copiar</button>
      <button data-act="connect">conectar</button>` : ""}
    </div>
  </div>`;
}

async function check() {
  try {
    const res = await fetch("/api/query?addr=" + encodeURIComponent(ADDR));
    result = await res.json();
  } catch {
    result = { online: false, error: "nao consegui falar com o server.py" };
  }
  document.getElementById("stamp").textContent = new Date().toLocaleTimeString("pt-BR");
  render();
}

document.getElementById("list").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.act === "players") { showPlayers = !showPlayers; }
  if (b.dataset.act === "copy") { navigator.clipboard?.writeText(ADDR); b.textContent = "copiado"; return; }
  if (b.dataset.act === "connect") { location.href = "steam://connect/" + ADDR; return; }
  render();
});

document.getElementById("refresh").addEventListener("click", check);
setInterval(check, 30000);

check();
</script>
</body>
</html>
